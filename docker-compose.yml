services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: pantry
      POSTGRES_PASSWORD: pantry
      POSTGRES_DB: pantry
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pantry -d pantry"]
      interval: 3s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15

  migrate:
    image: postgres:16.4-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: pantry
      PGPASSWORD: pantry
      PGDATABASE: pantry
    volumes:
      - ./migrations:/migrations:ro
    command: >
      sh -c 'for f in $$(ls /migrations/*.sql | sort); do
      echo "Applying $$f"; psql -v ON_ERROR_STOP=1 -f "$$f" || exit 1; done'

  app:
    build: .
    image: pantry-matcher:1.0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pantry:pantry@db:5432/pantry
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s